name: CI - Build TRASMULT

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Transmult_Proyecto_Final/inventario

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar tests
        run: mvn clean verify

      - name: Publicar artefacto (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: trasmult-build
          path: Transmult_Proyecto_Final/inventario/target/*.jar
