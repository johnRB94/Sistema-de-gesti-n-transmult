name: Integración Continua TRANSMULT

on:
  push:
    branches: [ "principal", "develop" ]
  pull_request:
    branches: [ "principal", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Entorno Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar dependencias
      working-directory: ./Transmult_Proyecto_Final/ inventario
      run: npm install

    - name: Compilación automática del proyecto
      working-directory: ./Transmult_Proyecto_Final/ inventario
      run: npm run build --if-present

    - name: Ejecutar pruebas básicas
      working-directory: ./Transmult_Proyecto_Final/ inventario
      run: npm test --if-present
