version: '3.8'

services:
  # Base de datos PostgreSQL para SonarQube
  postgres:
    image: postgres:15
    container_name: transmult-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonarpassword    # CAMBIA ESTA CONTRASEÑA
      POSTGRES_DB: sonarqube
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sonar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Servidor SonarQube
  sonarqube:
    image: sonarqube:community
    container_name: transmult-sonarqube
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"                          # Puerto para acceder a SonarQube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonarpassword     # DEBE coincidir con POSTGRES_PASSWORD
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - sonar-network
    restart: unless-stopped

  # pgAdmin (opcional - para administrar la BD visualmente)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: transmult-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@transmult.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword      
    ports:
      - "8081:80"                                 
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sonar-network
    restart: unless-stopped
    depends_on:
      - postgres

# Volúmenes persistentes
volumes:
  postgres_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  pgadmin_data:

# Red interna para comunicación entre contenedores
networks:
  sonar-network:
    driver: bridge
