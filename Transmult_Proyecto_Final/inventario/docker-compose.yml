version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql_transmult
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Fabricio.2002
      MYSQL_DATABASE: transmult_base
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: app_transmult
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/transmult_base?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Fabricio.2002

volumes:
  mysql_data:
